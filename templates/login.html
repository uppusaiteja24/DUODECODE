{% extends "base.html" %}
{% block title %}Log in | BrainBridge{% endblock %}
{% block content %}
<div class="form-wrap"><div class="form-card">
  <span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><p class="muted">Continue your learning journey.</p>
  <form method="post">
    <label>Email address<input name="email" type="email" required placeholder="you@example.com"></label>
    <label>Password<input name="password" type="password" required placeholder="Your password"></label>
    <button class="button primary full" type="submit">Log in →</button>
  </form>
  <p class="form-foot">New to BrainBridge? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
